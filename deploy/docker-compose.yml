# Libero deployment — two services plus per-channel state.
# The security property everything hangs on: tool credentials live only in the
# proxy, and the agent reaches tools only through it. The Slack tokens and the
# model provider key are set on the agent service below, because the gateway
# holds the socket and the loop calls the provider; they reach no tool.
#
# Run `sh scripts/dev-certs.sh` before the first `docker compose up`: the two
# services speak mutual TLS, and the certificate the agent presents is what
# tells the proxy which channel is calling. ./certs is generated and
# gitignored, and each container mounts only its role's slice of it — the CA's
# private key is mounted into neither, because a process that can mint
# certificates can name itself any channel.

services:
  server:
    image: ghcr.io/getlibero/server:latest
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}       # Socket Mode app-level token (xapp-)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}       # bot token (xoxb-)
      PROXY_URL: https://proxy:8443
      PROXY_TLS_CA: /etc/libero/certs/ca.pem      # verifies the proxy's own cert
      # One client cert per channel, client-<CHANNEL_ID>.pem. Which one the
      # agent presents is what identifies the channel to the proxy, so this
      # directory is the agent's entire authority: no cert, no call.
      PROXY_CLIENT_CERT_DIR: /etc/libero/certs/agent
      # LLM provider keys go HERE (completion only) — never tool credentials.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../channels:/data/channels
      # The trust anchor and the channel client certs — not ./certs whole. The
      # server key would let a compromised agent impersonate the proxy, and the
      # CA key would let it mint an identity for any channel.
      - ./certs/ca.pem:/etc/libero/certs/ca.pem:ro
      - ./certs/agent:/etc/libero/certs/agent:ro
    depends_on:
      - proxy
    networks: [libero]
    restart: unless-stopped

  proxy:
    image: ghcr.io/getlibero/proxy:latest
    build:
      context: ..
      dockerfile: apps/proxy-server/Dockerfile
    environment:
      # Encrypts credentials at rest. The `:?` form fails `docker compose up`
      # with this message rather than starting a container that restart-loops.
      PROXY_VAULT_KEY: ${PROXY_VAULT_KEY:?set PROXY_VAULT_KEY in .env — generate with: openssl rand -base64 32}
      # Read, and required. Secrets are loaded into it by an admin running
      # `docker compose run --rm proxy node dist/vault.js set <name>`, which
      # keeps the master key inside this container rather than on the host.
      PROXY_VAULT_FILE: /data/vault/vault.enc
      # Read, and required. The proxy resolves
      # <PROXY_CHANNELS_ROOT>/<channel>/channel.toml on every call and refuses
      # anything the sheet does not permit, so for this service the directory is
      # the authorization source rather than shared state. Removing a channel's
      # directory is how that channel is revoked.
      PROXY_CHANNELS_ROOT: /data/channels
      # Read, and required. The daily budget meter: per channel, per UTC day,
      # authoritative. SQLite writes -wal and -shm beside this file, so the
      # volume is mounted read-write and the *directory* has to be writable.
      # Reset a channel without restarting anything with
      # `docker compose run --rm proxy node dist/budget.js reset <channel>`.
      PROXY_BUDGET_DB: /data/budget/budget.db
      AUDIT_DB: /data/audit/audit.db
      # 0.0.0.0 reaches only the private bridge below, which publishes no
      # ports. Outside compose the default is 127.0.0.1.
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 8443
      PROXY_TLS_CERT: /etc/libero/certs/proxy/server.pem
      PROXY_TLS_KEY: /etc/libero/certs/proxy/server.key
      # Client certs are verified against this CA and nothing else. A client
      # without one signed by it cannot open a connection.
      PROXY_TLS_CA: /etc/libero/certs/ca.pem
    volumes:
      - ../channels:/data/channels:ro           # team sheets are read-only to services
      # Its own keypair and the trust anchor; no client keys, no CA key.
      - ./certs/ca.pem:/etc/libero/certs/ca.pem:ro
      - ./certs/proxy:/etc/libero/certs/proxy:ro
      - audit-data:/data/audit
      - budget-data:/data/budget
      - vault-data:/data/vault
      - /var/run/docker.sock:/var/run/docker.sock   # sandbox runner (see docs for gVisor)
    networks: [libero]
    # No published ports: the proxy listens only on the private network.
    restart: unless-stopped

  # Optional sidecar for exotic LLM providers behind an OpenAI-compatible endpoint.
  # Enable with: docker compose --profile litellm up
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [litellm]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    networks: [libero]

networks:
  libero:
    driver: bridge

volumes:
  audit-data:
  budget-data:
  vault-data:
