# Libero deployment — two services plus per-channel state.
# The security property everything hangs on: tool credentials live only in the
# proxy, and the agent reaches tools only through it. The Slack tokens and the
# model provider key are set on the agent service below, because the gateway
# holds the socket and the loop calls the provider; they reach no tool.
#
# Run `sh scripts/dev-certs.sh` before the first `docker compose up`: the two
# services speak mutual TLS, and the certificate the agent presents is what
# tells the proxy which channel is calling. ./certs is generated and
# gitignored, and each container mounts only its role's slice of it — the CA's
# private key is mounted into neither, because a process that can mint
# certificates can name itself any channel.

services:
  server:
    image: ghcr.io/getlibero/server:latest
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}       # Socket Mode app-level token (xapp-)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}       # bot token (xoxb-)
      PROXY_URL: https://proxy:8443
      PROXY_TLS_CA: /etc/libero/certs/ca.pem      # verifies the proxy's own cert
      # One client cert per channel, client-<CHANNEL_ID>.pem. Which one the
      # agent presents is what identifies the channel to the proxy, so this
      # directory is the agent's entire authority: no cert, no call.
      PROXY_CLIENT_CERT_DIR: /etc/libero/certs/agent
      # Which provider to complete against, and which model. Both required,
      # neither defaulted: the provider is never inferred from whichever key
      # below happens to be set, because both are declared here and inference
      # would quietly bill the other account. A default model id would go stale
      # on the provider's schedule and pin a price nobody chose.
      AGENT_PROVIDER: ${AGENT_PROVIDER:-anthropic}   # anthropic | openai-compatible
      AGENT_MODEL: ${AGENT_MODEL:?set AGENT_MODEL in .env — e.g. claude-sonnet-4-6}
      # The same team sheets the proxy reads, read differently. Here they are
      # advisory: a channel's `[llm] model` and its four per-task caps, which
      # the loop applies to its own turns as defence in depth. Nothing the
      # agent reads from them can widen what a channel may do — the proxy
      # decides that from its own copy, and its meter is what is authoritative.
      AGENT_CHANNELS_ROOT: /data/channels
      # The per-channel message stores: one <channel>/store.db, written as
      # ordinary messages arrive. A separate root from the sheets above, and
      # that is a security decision rather than tidiness — the channels
      # directory is where the proxy reads its authorization from and stays
      # read-only to both services, so an agent that could write there could
      # rewrite a channel.toml and widen what its own channel may do. Everything
      # this process writes goes here instead.
      #
      # SQLite writes -wal and -shm beside each file, so the volume is mounted
      # read-write and the *directory* has to be writable. Unlike the two proxy
      # databases, this one holds message text: it is a channel's conversation,
      # and it belongs to that channel's members.
      #
      # It also holds a channel's scheduled checks. See what one is waiting on,
      # or call one off, without restarting anything:
      # `docker compose run --rm server node dist/tasks.js list <channel>`,
      # `... cancel <channel> <id>`, and `... cancelled <channel>` for the
      # record a cancel leaves. That lives here rather than in the published
      # CLI because this is a named volume the host cannot see, and here rather
      # than on the proxy because the proxy mounts it read-only and a cancel is a
      # write.
      AGENT_STORE_ROOT: /data/store
      # LLM provider keys go HERE (completion only) — never tool credentials.
      # Each provider's own conventional variable: the one matching
      # AGENT_PROVIDER is required, the other is ignored. The base URLs are
      # optional and are what reach anything other than the provider's own
      # endpoint — Together, Fireworks, Groq, Ollama, Gemini's compatibility
      # endpoint, or the litellm sidecar below are all one base URL apart.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Embeddings are a SECOND provider, not a mode of the one above: Anthropic
      # publishes no embeddings endpoint, so the ordinary deployment completes
      # against one vendor and embeds against another. All four are optional
      # together — unset turns semantic recall off and leaves memory Layers 1
      # and 2 whole, which the service says once at startup.
      AGENT_EMBEDDING_PROVIDER: ${AGENT_EMBEDDING_PROVIDER:-}
      AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-}
      AGENT_EMBEDDING_API_KEY: ${AGENT_EMBEDDING_API_KEY:-}
      AGENT_EMBEDDING_BASE_URL: ${AGENT_EMBEDDING_BASE_URL:-}
    volumes:
      # Read-only: the agent reads sheets and writes none. The proxy's mount is
      # already :ro for the same reason.
      - ../channels:/data/channels:ro
      # The one writable mount this service has, and it is deliberately not the
      # one above. See AGENT_STORE_ROOT.
      - store-data:/data/store
      # The trust anchor and the channel client certs — not ./certs whole. The
      # server key would let a compromised agent impersonate the proxy, and the
      # CA key would let it mint an identity for any channel.
      - ./certs/ca.pem:/etc/libero/certs/ca.pem:ro
      - ./certs/agent:/etc/libero/certs/agent:ro
    depends_on:
      - proxy
    networks: [libero]
    restart: unless-stopped
    # Explicit, because the shutdown path now depends on the number (#118).
    # SIGTERM cancels every task and then waits up to SHUTDOWN_DRAIN_MS — eight
    # seconds — for the cancelled tasks to report their last turn's spend and
    # repaint their checklist cards. Docker's default grace period is ten
    # seconds, which leaves that drain no room, and a SIGKILL through it loses
    # exactly what the drain exists to save. Twenty is the drain plus room for
    # a slow Slack call, not a number a long task can finish inside: a task's
    # own bound is the channel's `max_task_seconds`, five minutes by default,
    # and shutdown does not wait for it.
    stop_grace_period: 20s

  proxy:
    image: ghcr.io/getlibero/proxy:latest
    build:
      context: ..
      dockerfile: apps/proxy-server/Dockerfile
    environment:
      # Encrypts credentials at rest. The `:?` form fails `docker compose up`
      # with this message rather than starting a container that restart-loops.
      # Quoted because the message contains ": ", which YAML would otherwise
      # read as a nested mapping — the whole file fails to parse without it.
      PROXY_VAULT_KEY: "${PROXY_VAULT_KEY:?set PROXY_VAULT_KEY in .env — generate with: openssl rand -base64 32}"
      # Read, and required. Secrets are loaded into it by an admin running
      # `docker compose run --rm proxy node dist/vault.js set <name>`, which
      # keeps the master key inside this container rather than on the host.
      PROXY_VAULT_FILE: /data/vault/vault.enc
      # Read, and required. The proxy resolves
      # <PROXY_CHANNELS_ROOT>/<channel>/channel.toml on every call and refuses
      # anything the sheet does not permit, so for this service the directory is
      # the authorization source rather than shared state. Removing a channel's
      # directory is how that channel is retired; dropping a fingerprint from
      # its sheet's certificate_sha256 is how one leaked key is revoked while
      # the channel goes on working.
      PROXY_CHANNELS_ROOT: /data/channels
      # Read, and required. The daily budget meter: per channel, per UTC day,
      # authoritative. SQLite writes -wal and -shm beside this file, so the
      # volume is mounted read-write and the *directory* has to be writable.
      # Reset a channel without restarting anything with
      # `docker compose run --rm proxy node dist/budget.js reset <channel>`.
      PROXY_BUDGET_DB: /data/budget/budget.db
      # Read, and required. The audit log: one row per decided tool call —
      # served, held, refused, permitted with no upstream, or decided and then
      # never answered. SQLite writes -wal and -shm beside this file, so the
      # *directory* has to be writable.
      #
      # Query and export it with
      # `docker compose run --rm proxy node dist/audit.js list --channel <id>`,
      # or `... csv > audit.csv`. That connection is opened read-only, so it is
      # safe against a running proxy and cannot write the log.
      #
      # Append-only, enforced by triggers on the table itself, so there is no
      # reset command and will not be one: deleting rows from an audit log is
      # the operation an attacker wants. Growth is small — roughly 200 bytes a
      # row, so 10k calls a day is about 2 MB a day — and the answer when that
      # stops being small is to rotate the file, not to prune it.
      PROXY_AUDIT_DB: /data/audit/audit.db
      # The attempt store (#364): what a blocked call tried to do, in full,
      # beside the audit log whose rows carry its key. Unlike audit.db this
      # file can hold secrets — its content is the model's own arguments,
      # captured raw — and unlike audit.db it is deletable by design:
      # `node dist/audit.js attempt-delete <hash>` removes a record and the
      # chain stays green. Unsetting this variable is the off switch; the
      # proxy says so once at startup rather than failing.
      PROXY_ATTEMPTS_DB: /data/audit/attempts.db
      # Read, and required. The per-channel message stores the gateway writes,
      # read here to answer search_channel_history (#64). Same directory the
      # server service mounts as AGENT_STORE_ROOT; two names because the two
      # services are configured separately.
      #
      # Every file is opened readOnly and per call. The mount below is still
      # read-write, and has to be: a SQLite WAL reader creates the -shm and -wal
      # sidecars beside the file, so a :ro mount fails at the first search.
      #
      # Deliberately not PROXY_CHANNELS_ROOT. Team sheets are where this service
      # reads its authorization from, so the agent must never be able to write
      # there; the store lives on the agent's writable side and this is a
      # different path. The channels mount stays :ro on both services.
      PROXY_STORE_ROOT: /data/store
      # OPTIONAL, and the only optional path this service reads (#62). What a
      # model's tokens cost, so a channel's [budget] daily_usd can mean
      # something. Leave it unset if no channel caps in dollars; there is no
      # default table, because a price list baked into a released image goes
      # stale on the provider's schedule and is then trusted.
      #
      # Absent fails CLOSED, which is what makes optional safe here: with no
      # table every model is unpriced, and a channel with daily_usd set is
      # refused rather than metered at zero. The deployments that need this are
      # exactly the ones that stop working without it.
      #
      # Host-authored and read-only, so it is bind-mounted beside ../channels
      # rather than living in a named volume like the three databases above.
      # Nothing writes beside it and its directory need not be writable.
      #
      # The proxy logs the model each spend report names (`spend_reported`),
      # which is the spelling to key this file by: under a router that is not
      # the model a team sheet asked for.
      PROXY_PRICE_TABLE: ${PROXY_PRICE_TABLE:-}
      # 0.0.0.0 reaches only the private bridge below, which publishes no
      # ports. Outside compose the default is 127.0.0.1.
      # The sandbox runner (#395), and all four are commented out together.
      #
      # RUNNER_URL is the switch: unset, the proxy composes an unavailable arm
      # and a channel granting `run_code` is answered `not_implemented`. Set, the
      # other three are required at boot — a deployment that named a runner and
      # forgot its client material should fail at `docker compose up` rather than
      # at the far end of a Slack thread.
      #
      # `runner` is the service name and it resolves only on the internal
      # runner-control network, which the agent is not on.
      # RUNNER_URL: https://runner:8444
      # RUNNER_CLIENT_CERT: /etc/libero/certs/proxy/client.pem
      # RUNNER_CLIENT_KEY: /etc/libero/certs/proxy/client.key
      # RUNNER_CLIENT_CA: /etc/libero/certs/ca.pem
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 8443
      # How much of an upstream's answer this process will hold before
      # abandoning it. Size it against the container's memory limit, not against
      # what an upstream returns: budget three to five times this value per
      # concurrent call, because the decoded string, the redaction pass's copy,
      # and the parsed object graph all exist at once.
      #
      # Not a team sheet field, and that is a boundary rather than a filing
      # choice — this heap is shared by every channel the proxy serves. What a
      # channel *can* set is how much of a result reaches its model, in
      # [llm] max_result_chars.
      PROXY_MAX_RESPONSE_BYTES: 4194304
      # How many calls this process will run against one tool server at once.
      # The factor that makes the bound above a number you can multiply out:
      # worst case against one misbehaving upstream is that value, times its
      # three-to-five-fold decoding overhead, times this.
      #
      # Also a fairness setting. Every channel naming one url and one credential
      # shares this budget, so a busy channel cannot spend a shared server's rate
      # limit on the others' behalf. A call past the limit waits briefly and is
      # then told it was not made.
      PROXY_MAX_UPSTREAM_CONCURRENCY: 8
      # How long any one outbound request may hold a socket: each tool call,
      # and each OAuth token exchange. Safe to lower — past the window a call
      # is "timed out", a failed call rather than a served one.
      PROXY_UPSTREAM_TIMEOUT_MS: 30000
      PROXY_TLS_CERT: /etc/libero/certs/proxy/server.pem
      PROXY_TLS_KEY: /etc/libero/certs/proxy/server.key
      # Client certs are verified against this CA and nothing else. A client
      # without one signed by it cannot open a connection.
      PROXY_TLS_CA: /etc/libero/certs/ca.pem
    volumes:
      - ../channels:/data/channels:ro           # team sheets are read-only to services
      # The price table (#62), beside the sheets and read-only for the same
      # reason: both are host-authored, reviewed, and nothing writes them. Set
      # PROXY_PRICE_TABLE above to the container path to turn it on; with the
      # variable unset this mount is inert.
      - ../prices:/data/prices:ro
      # Its own keypair and the trust anchor; no client keys, no CA key.
      #
      # Since #395 `certs/proxy` holds two certificates rather than one: the
      # server certificate this service presents to the agent, and the *client*
      # certificate it presents to the runner. The second is the only connection
      # in the deployment this process opens where it has to prove who it is.
      - ./certs/ca.pem:/etc/libero/certs/ca.pem:ro
      - ./certs/proxy:/etc/libero/certs/proxy:ro
      - audit-data:/data/audit
      - budget-data:/data/budget
      - vault-data:/data/vault
      # The channel stores the server service writes, for search_channel_history
      # (#64). Read-write because a SQLite WAL reader creates the -shm and -wal
      # sidecars; the read-only-ness is `{ readOnly: true }` on each connection,
      # which is the posture the audit reader already takes. This service opens
      # no store for writing and has no statement that could.
      - store-data:/data/store
      # No Docker socket. It was here for the stdio transport's sandbox runner,
      # which is #154 and unbuilt — nothing in this repository opens it — and it
      # was harmless only for as long as this file could not be started at all.
      # A process that can reach the daemon socket can start a privileged
      # container mounting the host's root filesystem, so mounting it here would
      # give the process holding every tool credential a supported path to root
      # on the host, and would make "compromising the agent yields no tool
      # credentials" a claim about the less interesting direction.
      #
      # The code-execution sandbox (#368) is the thing that actually needs a
      # runtime, and #393 decided how it gets one: the socket moves rather
      # than returns. A separate `runner` service holds it and exposes one
      # narrow mTLS endpoint — a run-spec it does not take fields from — on a
      # network the agent has no route to. The privilege and the credentials
      # then sit in two different processes, which is the inverse of the mount
      # this comment refuses. See packages/proxy/README.md for the argument and
      # deploy/README.md for what that service mounts; #397 lands the block.
      #
      # This line does not change when it does. Nothing gives the proxy the
      # socket.
    # Two networks. `libero` is where the agent reaches it; `runner-control` is
    # where it reaches the runner, and the agent has no route onto that one.
    networks: [libero, runner-control]
    # No published ports: the proxy listens only on the private network.
    restart: unless-stopped

  # Optional sidecar for exotic LLM providers behind an OpenAI-compatible endpoint.
  # Enable with: docker compose --profile litellm up
  # The sandbox runner (#368, #393, #395).
  #
  # The one service that can reach the container runtime, and the one that holds
  # no credential. That pairing is the whole decision: the socket is equivalent
  # to root on the host, so it belongs anywhere except the process holding every
  # tool credential. See packages/proxy/README.md, "Reaching a runtime", and
  # deploy/README.md for what this mounts and what it deliberately does not.
  #
  # BEHIND A PROFILE, like litellm, rather than commented out. A deployment whose
  # channels never grant `run_code` should not run it — with no RUNNER_URL set on
  # the proxy a granted call answers `not_implemented`, which says the sheet is
  # right and this deployment did not build the service. But a commented-out
  # service is not validated, not built by CI, and not covered by the image
  # assertions, so it rots. A profile is opt-in and still real:
  #
  #   docker compose --profile runner up -d
  #
  # Turning it on is that, plus the proxy's four RUNNER_* variables above, plus
  # RUNNER_SANDBOX_IMAGE, RUNNER_CLIENT_PIN and DOCKER_GID in .env. The three
  # have no usable defaults and the process refuses to start without them, which
  # is the intended failure: each names a thing only the operator knows.
  runner:
    image: ghcr.io/getlibero/runner:latest
    build:
      context: ..
      dockerfile: apps/runner/Dockerfile
    profiles: [runner]
    environment:
      # The daemon, as this container sees it. The bind mount below is what puts
      # it there; the path inside is ours to choose and is stable.
      RUNNER_DOCKER_SOCKET: /var/run/docker.sock
      # Pinned by digest, and refused at boot if it is not: #393 made the image a
      # deployment fact, and a floating tag makes it a fact about whenever the
      # daemon last pulled. Resolve one you have reviewed —
      # `docker buildx imagetools inspect python:3.13-alpine` prints it — and
      # pull it at deploy time. The runner never pulls.
      RUNNER_SANDBOX_IMAGE: "${RUNNER_SANDBOX_IMAGE:-}"
      # The interpreter and its flags; the model's code is appended as the final
      # argument. This is what keeps the tool language-neutral, and it is why the
      # built-in is `run_code` rather than `run_python` — swapping to
      # ["node","-e"] is an .env edit rather than a code change.
      RUNNER_SANDBOX_COMMAND: '["python3","-c"]'
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: 8444
      RUNNER_TLS_CERT: /etc/libero/certs/runner/server.pem
      RUNNER_TLS_KEY: /etc/libero/certs/runner/server.key
      RUNNER_TLS_CA: /etc/libero/certs/ca.pem
      # THE PIN, AND IT IS NOT OPTIONAL. One CA signs both the proxy's client
      # certificate and every agent channel certificate, so a runner trusting the
      # CA alone would serve a compromised agent process directly — no team
      # sheet, no decision, no meter, no audit row. `sh scripts/dev-certs.sh`
      # prints this value when it mints deploy/certs/proxy/client.pem.
      RUNNER_CLIENT_PIN: "${RUNNER_CLIENT_PIN:-}"
    volumes:
      # The one privilege, and the only mount that is not a certificate.
      # Read-write because starting a container is a write; there is no
      # read-only form of this that does anything useful.
      - /var/run/docker.sock:/var/run/docker.sock
      # Its own keypair and the trust anchor. No client keys, no CA key, and none
      # of the four data volumes: no channels, no prices, no vault, no store, no
      # audit, no budget. The list of what is absent here is the claim "the
      # runner holds no credential", in a form an operator can check by reading.
      - ./certs/ca.pem:/etc/libero/certs/ca.pem:ro
      - ./certs/runner:/etc/libero/certs/runner:ro
    # Reaching a root-owned socket as a non-root user. The gid is the HOST's
    # docker group and differs between distributions — Debian on GCP and AL2023
    # on AWS do not agree — so it is an operator variable rather than a number
    # this file can know. `getent group docker | cut -d: -f3` on the host prints
    # it. The default is deliberately not a guess: 0 is the root group, which
    # every host has and which will not open the socket on any of them, so a
    # deployment that forgot the variable fails rather than quietly working on
    # the one distribution somebody guessed.
    group_add:
      - "${DOCKER_GID:-0}"
    # One network, and it is internal. The agent is not on it, so the pin above
    # is the second wall rather than the only one: a compromised agent has no
    # route to this service at all.
    networks: [runner-control]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [litellm]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    networks: [libero]

networks:
  libero:
    driver: bridge
  # The proxy-to-runner control plane (#393). `internal: true` means no route
  # out and no route in from anywhere else on this host — the agent is not a
  # member, so it cannot reach the service that can start containers even with
  # a certificate this CA signed.
  #
  # It exists whether or not the runner is enabled, because a network with one
  # member costs nothing and a commented-out network is one more thing to
  # remember when uncommenting the service.
  runner-control:
    driver: bridge
    internal: true

volumes:
  audit-data:
  budget-data:
  # The only one holding channel content rather than operator records, and the
  # only one both services mount: the server writes every inbound message, and
  # since #64 the proxy reads one back to answer search_channel_history. The
  # proxy opens each file readOnly.
  store-data:
  vault-data:
