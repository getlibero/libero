name: CLA

# Signatures are recorded in signatures/cla.json on the cla-signatures branch.
#
# issue_comment is what makes signing possible at all: both the signature
# phrase and "recheck" are processed by matching the body of a new comment.
#
# pull_request_target, not pull_request: a fork's PR gets a read-only
# GITHUB_TOKEN under pull_request, so the action could neither record the
# signature nor post its comment — which is every outside contribution, the
# exact case a CLA exists for. pull_request_target runs in the base repo
# with a write token.
#
# SECURITY: because this runs with a write token in the base-repo context,
# it must never check out or execute pull request code. Do not add
# actions/checkout to this workflow.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write # signatures live in this repo on the cla-signatures branch
      pull-requests: write
      statuses: write
    steps:
      - name: Check CLA signature
        # Ignore unrelated comments, and issue comments that aren't on a PR.
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request != null &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # Pinned to a SHA, not the v2.6.1 tag. This step runs with a write
        # token, and a tag is mutable — whoever controls that repo could
        # repoint v2.6.1 at any time. v2.6.1 is the latest release, so the
        # pin costs no updates. Verify before bumping:
        #   gh api repos/contributor-assistant/github-action/git/ref/tags/<tag> --jq .object.sha
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/getlibero/libero/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot]
