name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Pinned to the major, not to a patch, but the major matters: the
          # message store needs FTS5, and `node:sqlite` gained it in 22.16 and
          # 24.0. `node-version: 22` resolved to a 22.x past 22.16, so CI would
          # have passed while the stated floor of 22.13 failed on an operator's
          # machine with `no such module: fts5`.
          #
          # `@types/node`'s major follows this same floor, and there is now one
          # floor: `^24` everywhere, matching `engines: >=24` everywhere.
          # packages/cli was the exception at `^22` while it printed three lines
          # and published `engines: >=22`; #217 gave it commands that share code
          # with core, so it moved. That pin is this hazard pointed the other
          # way — types ahead of the runtime typecheck the tree against APIs an
          # operator on the supported floor does not have, and nothing here
          # would fail. `pnpm update` offers the newest major; take it when a
          # floor moves and not before.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        # tsc --noEmit in the typecheck step misses emit-only failures; catch
        # them here rather than in the release workflow.
        #
        # There is deliberately no Typecheck step beside this one. Every package
        # builds with `tsc -p tsconfig.json` and typechecks with the same
        # invocation plus `--noEmit`, over the same project and the same files —
        # so `pnpm typecheck` is a strict subset of what this step already did,
        # and could only fail where this one had. The root script stays, because
        # skipping emit is the faster answer while you are working; it just has
        # nothing left to say once a build has passed.
        run: pnpm -r build
      - name: Tests
        # Every package that does not need a Docker daemon — which is every
        # package but two, each of which has a job below. The exclusions are
        # filters here rather than a change to the root `test` script, so
        # `pnpm test` on a contributor's machine still runs everything.
        #
        # `@getlibero/runner` is the one that moved (#410), and it took the
        # whole package rather than one file: its container cases and its five
        # daemon-free files are one `test` script, and every `test` script in
        # this repository is the same string on purpose
        # (`packages/test-kit/src/test-scripts.test.ts`). Splitting the package
        # would have meant hand-written globs in this file, which is the
        # #107-successor hazard that guard exists to catch, moved somewhere
        # nothing checks it.
        #
        # This line and the three below have to partition the workspace between
        # them, and `packages/test-kit/src/ci-partition.test.ts` asserts that
        # they do: drop a name from any of the four and that suite stops
        # running with nothing failing.
        run: pnpm -r --filter '!@getlibero/e2e' --filter '!@getlibero/runner' --filter '!@getlibero/litellm-conformance' --filter '!@getlibero/aws-conformance' test
      - name: The CLI publishes one file and no dependency
        # `@getlibero/cli` is the only package anyone installs from npm. The
        # script packs it the way release-cli.yml publishes it, then checks the
        # tarball: a manifest with no dependencies and no `workspace:` spec, a
        # bundle that RUNS on its own, and the script, licence and notices that
        # have to travel with it. One script shared with the release workflow,
        # so the two cannot check different things.
        #
        # After Tests, deliberately. The `test` script runs tsc, which emits
        # into the same dist/ the build wrote; a check placed before it passes
        # on files the next step may overwrite. That ordering is how v0.6.0
        # and v0.7.0 shipped an entry stub that could not start.
        run: sh scripts/cli-tarball-check.sh

  e2e:
    # The security suite, alone on a runner with a Docker daemon.
    #
    # `e2e` declares every other workspace package as a dependency, so
    # `pnpm -r` sorted it last and it ran by itself at the tail of the build
    # job: 103 seconds of a 191-second test step, with three of the runner's
    # four vCPUs idle. Nothing about that ordering is load-bearing once the
    # build has run — it is just how `pnpm -r` sorts — so the suite moved to a
    # runner of its own.
    #
    # `sandbox` below is its sibling and #410's other half. The two are separate
    # jobs rather than one, and **that is a correctness requirement, not a
    # scheduling preference.** Both need a daemon; put them on one and they must
    # run in series, because `apps/runner/src/sandbox.docker.test.ts` asserts
    # that no container on the daemon descends from `python:3.13-alpine` — a
    # deliberately daemon-wide claim, since a leaked container is one whose id
    # the suite never learned — and this file keeps a long-lived sink container
    # running on exactly that image. Concurrently they collide; in series the
    # job is the critical path. A daemon each is what makes both go away.
    #
    # The cost is a second `pnpm -r build`. It is the same trade
    # `lint-and-license` makes below, and it is paid in parallel; the build is
    # 20 seconds against a suite that is five times that.
    #
    # `pnpm -r build` and not a narrower filter: the suite spawns the proxy as
    # its built entrypoint (`e2e/src/harness/proxy-process.ts` resolves
    # `@getlibero/proxy-server` and fails loudly if `dist` is not there), and
    # every workspace package it imports resolves through `dist` too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The same floor as the build job, for the same FTS5 reason — this
          # one does open databases, through `packages/memory`.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, and fetch the sandbox fixtures beside it
        # `pnpm -r build` is 20 seconds of tsc that touches nothing outside
        # `dist`; the two fixtures are a pull and an image build that touch
        # nothing but the daemon. `prepareSandboxFixtures` fetched them
        # serially at the head of the suite, which measured a little under a
        # minute with the rest of the runner idle, so they run alongside the
        # build instead.
        #
        # This warms the daemon; it does not become the source of truth.
        # `e2e/src/harness/runner-process.ts` still inspects and fetches what is
        # absent, which is what makes a laptop run need no workflow at all and
        # is why deleting these lines costs wall clock and nothing else.
        # `.dockerignore` re-excludes `**/dist` and `**/node_modules`, so the
        # context this sends and the tree `pnpm -r build` is writing do not
        # overlap.
        run: |
          docker pull --quiet python:3.13-alpine > "$RUNNER_TEMP/sandbox-pull.log" 2>&1 &
          pull=$!
          docker build --quiet -f apps/runner/Dockerfile -t ghcr.io/getlibero/runner:latest . \
            > "$RUNNER_TEMP/runner-image.log" 2>&1 &
          image=$!
          pnpm -r build
          wait "$pull" || { cat "$RUNNER_TEMP/sandbox-pull.log"; exit 1; }
          wait "$image" || { cat "$RUNNER_TEMP/runner-image.log"; exit 1; }
      - name: Security suite
        # This job needs a Docker daemon, which is not obvious from the step and
        # is not optional: `e2e/src/sandbox-attack.test.ts` throws at module
        # load when `CI` is true and no socket is present, rather than skipping,
        # so that #396's acceptance cases cannot quietly report green. A
        # `runs-on` without a daemon fails this job — which is the intent, not a
        # fragility to route around.
        #
        # That gate reaches only as far as this line naming the package: drop it
        # and the cases stop running with nothing failing, which is the
        # test-that-encodes-a-gap rule one level up.
        # `packages/test-kit/src/ci-partition.test.ts` is what makes that
        # mechanical — it reads this file and asserts that the three test steps
        # partition the workspace, and that a package whose suite gates on a
        # daemon is never run beside one that does not.
        run: pnpm --filter @getlibero/e2e test

  sandbox:
    # #395's acceptance cases, which need a Docker daemon and nothing else this
    # repository builds.
    #
    # They ran in `build` until #410, where they were the largest single thing
    # on the critical path: 58.9 seconds of a 103-second test step on run
    # 32572814070, and for 37 of those the other three vCPUs had nothing to do,
    # because `apps/runner` is a leaf that everything else was waiting behind.
    # Most of it was not testing — it was one `docker pull` and one
    # `docker build` that `e2e` was paying for a second time on its own runner.
    #
    # A job of its own rather than a seat on `e2e`: the two suites cannot share
    # a daemon concurrently, for the reason recorded above that job. So the
    # choice was series on one runner or parallel on two, and this is the
    # second. It costs a duplicate fetch of both fixtures, paid on a runner
    # nothing waits for.
    #
    # `pnpm --filter @getlibero/runner... build` and not `pnpm -r build`: unlike
    # `e2e`, nothing here spawns another package's built entrypoint. `...` is
    # this package and what it depends on, which is `@getlibero/schema` and
    # `@getlibero/test-kit` — about five seconds against the twenty a full build
    # costs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The same floor as the build job. Nothing here opens a database, but
          # a second Node version in one workflow is a thing to explain rather
          # than a thing to inherit.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, and fetch the sandbox fixtures beside it
        # The same warm as the `e2e` job, and the same caveat: it warms the
        # daemon and does not become the source of truth, because
        # `sandbox.docker.test.ts` still inspects and fetches what is absent.
        # Here the build it overlaps is the short one, so most of the step is
        # the fixtures.
        #
        # The LiteLLM image joins the same warm for #480. It is pulled rather
        # than built, and `sidecar.docker.test.ts` pulls it too if it is absent,
        # so this only moves the wait off the test step's clock.
        run: |
          docker pull --quiet python:3.13-alpine > "$RUNNER_TEMP/sandbox-pull.log" 2>&1 &
          pull=$!
          docker pull --quiet ghcr.io/berriai/litellm:main-stable > "$RUNNER_TEMP/litellm-pull.log" 2>&1 &
          sidecar=$!
          docker build --quiet -f apps/runner/Dockerfile -t ghcr.io/getlibero/runner:latest . \
            > "$RUNNER_TEMP/runner-image.log" 2>&1 &
          image=$!
          pnpm --filter @getlibero/runner... --filter @getlibero/litellm-conformance... \
            --filter @getlibero/aws-conformance... build
          wait "$pull" || { cat "$RUNNER_TEMP/sandbox-pull.log"; exit 1; }
          wait "$sidecar" || { cat "$RUNNER_TEMP/litellm-pull.log"; exit 1; }
          wait "$image" || { cat "$RUNNER_TEMP/runner-image.log"; exit 1; }
      - name: Sandbox acceptance cases
        # This job needs a Docker daemon for the same reason the `e2e` job does
        # and with the same two-sided gate:
        # `apps/runner/src/sandbox.docker.test.ts` throws at module load when
        # `CI` is true and no socket is present, rather than skipping, so that
        # #395's acceptance cannot quietly report green. Delete this job and
        # `ci-partition.test.ts` fails, because nothing would then run
        # `@getlibero/runner`.
        run: pnpm --filter @getlibero/runner test
      - name: Live LiteLLM sidecar conformance
        # #480's acceptance, and the second daemon-gated package on this job —
        # the first time two share one. `ci-partition.test.ts` permits it and
        # says why: it forbids a daemon-gated suite running beside one that is
        # not, and the reason `e2e` and `sandbox` are apart is a specific image
        # collision rather than a general rule. A LiteLLM container matches
        # neither of the runner's leak filters.
        #
        # A separate step rather than a second `--filter` on the one above, so
        # the two suites run in series on this runner. They do not collide, but
        # `docker pull` and two sets of containers on four vCPUs is contention
        # with nothing to gain — the job is not the critical path.
        run: pnpm --filter @getlibero/litellm-conformance test
      - name: Live LocalStack custody conformance
        # #484's acceptance, and the third daemon-gated package on this job.
        # Same question #480 answered and the same answer: LocalStack's
        # containers are named `libero-localstack-*` and descend from
        # `localstack/localstack`, matching neither of the runner's leak
        # filters, so a job of its own would buy a fourth runner to avoid a
        # collision that does not exist.
        #
        # It pulls its own image rather than joining the warm-up above: the pull
        # is a single layer set the runner caches between jobs, and the suite
        # waits on LocalStack's health endpoint anyway, so a background pull
        # would save nothing this job is short of.
        run: pnpm --filter @getlibero/aws-conformance test

  lint-and-license:
    # Lint and the license gate read the source tree and node_modules, never
    # `dist` — so neither has any reason to wait behind a build, and behind one
    # is where they were. On their own runner they cost wall-clock nothing,
    # because the build job is longer than this whole job.
    #
    # The cost is a second install. It is paid in parallel and it is small: the
    # store is cached, so the install step measures about three seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The same floor as the build job, for the same FTS5 reason. Neither
          # of these steps opens a database, but a second Node version in one
          # workflow is a thing to explain rather than a thing to inherit.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes agent→proxy import ban)
        run: pnpm lint
      - name: License gate (fails on copyleft)
        run: pnpm license-check

  boundary-check:
    # Belt-and-suspenders alongside the ESLint rule: grep-level check that
    # nothing on the agent side of the boundary — packages/agent, packages/gateway,
    # or the apps/server process that composes both — references the proxy package.
    # The check itself is scripts/boundary-check.sh, which says why it is a raw
    # string match; running the script rather than a copy of the grep is what
    # keeps `pnpm boundary-check` and CI from drifting.
    #
    # No pnpm install: the script is shell over a checkout and needs no
    # dependencies, which is also why this job stays separate from build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce agent/proxy boundary
        run: sh scripts/boundary-check.sh

  images:
    # All three services ship as images, so a Dockerfile that does not build is
    # a release that does not happen. This job is the thing that fails first.
    #
    # It builds through deploy/docker-compose.yml rather than calling
    # `docker build` three times, because the compose file is what an operator
    # runs and its build contexts, dockerfile paths and image names are part of
    # what can break. No pnpm install: the builder stage does its own, from the
    # same frozen lockfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build all three images
        # The values are placeholders and none of them reaches a layer — they
        # exist because compose interpolates the whole file before it builds,
        # and the two `:?` guards fail on an empty value as readily as on a
        # missing one. That is wanted at `up` time; here it just means a build
        # needs an environment to parse against. `.env.example` cannot serve:
        # it ships PROXY_VAULT_KEY empty, which is exactly what `:?` rejects.
        env:
          PROXY_VAULT_KEY: ci-placeholder-not-a-key
          AGENT_MODEL: ci-placeholder-not-a-model
          SLACK_APP_TOKEN: ci-placeholder
          SLACK_BOT_TOKEN: ci-placeholder
        # `--profile runner` because the sandbox runner is opt-in at `up` time
        # and must not be opt-in at build time: a service nothing builds is a
        # service that rots, and the reason it is a profile rather than a
        # commented-out block is precisely so CI still covers it.
        run: docker compose -f deploy/docker-compose.yml --profile runner build

      - name: Nothing in any image but what runs
        # The four assertions live in scripts/image-checks.sh — the argument
        # for them too — shared with release-images.yml, which re-runs them
        # against the published digests. One script, so what a PR checks and
        # what a release publishes cannot drift.
        run: scripts/image-checks.sh ghcr.io/getlibero/proxy:latest ghcr.io/getlibero/server:latest ghcr.io/getlibero/runner:latest

  workflow-guard:
    # A pull_request_target workflow runs with a write token against the base
    # repo. That is safe only while it never checks out or executes pull
    # request code. Enforce it mechanically rather than by comment, the same
    # way boundary-check backs up the ESLint rule above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No checkout in privileged workflows
        run: |
          # Match YAML keys, not any occurrence of the words: this file
          # mentions both in its own comments and error text.
          failed=0
          for f in .github/workflows/*.yml; do
            grep -qE '^[[:space:]]*pull_request_target:' "$f" || continue
            if grep -nE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*actions/checkout' "$f"; then
              echo "::error file=$f::$f is a pull_request_target workflow and checks out code. It runs with a write token against the base repo, so checking out the pull request head would let a fork execute arbitrary code with that token. Remove the checkout step."
              failed=1
            fi
          done
          exit $failed

  base-guard:
    # Pull requests target main, and CodeQL is the reason.
    #
    # It runs here as GitHub's *default setup*, which only analyzes pull
    # requests aimed at the default branch. Aim one somewhere else and no
    # analysis happens, the code_scanning rule on main has no result to judge,
    # and the merge blocks with every status check green and nothing to point
    # at. Neither of the two things that look like fixes is one: retargeting
    # when the parent merges fires no pull_request event, and reopening re-runs
    # every workflow in this repository while CodeQL stays quiet. Only a
    # synchronize with the base already on main triggers it. #417 hit this and
    # needed a rebase to get out.
    #
    # pages.yml states the rule this enforces, about site-build: a gate has to
    # run everywhere to be able to gate anywhere. CodeQL is the one gate that
    # cannot be made to, because default setup decides when it runs — so this
    # forbids the case rather than covering it.
    #
    # The cost is that stacked pull requests are not possible here. Work is
    # sequenced with issue dependencies rather than branch stacking, so there is
    # nothing to give up; if that ever changes, the alternative is advanced
    # CodeQL setup, and its price is a hardcoded language matrix that goes quiet
    # when a language is added. That fails open. This fails closed.
    runs-on: ubuntu-latest
    steps:
      # No `if:` on the job. A required status check that skips is one that can
      # go quiet, which is the failure being fixed — so it runs on every event
      # this workflow handles and decides inside the step.
      - name: Pull requests target main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "$EVENT is not a pull request; nothing to check."
            exit 0
          fi
          if [ "$BASE" = "main" ]; then
            echo "base is main"
            exit 0
          fi
          echo "::error::This pull request targets '$BASE' rather than main. CodeQL runs as GitHub's default setup, which only analyzes pull requests targeting the default branch, so this one would get no analysis and the code_scanning rule on main would block the merge with every other check green. Rebase onto main and retarget the pull request. Sequencing between pieces of work is expressed with issue dependencies, not by stacking branches."
          exit 1

# The CLA lives in its own workflow (cla.yml): it needs issue_comment and
# pull_request_target triggers, which would otherwise fire every job here on
# every PR comment.
