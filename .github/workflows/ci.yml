name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Pinned to the major, not to a patch, but the major matters: the
          # message store needs FTS5, and `node:sqlite` gained it in 22.16 and
          # 24.0. `node-version: 22` resolved to a 22.x past 22.16, so CI would
          # have passed while the stated floor of 22.13 failed on an operator's
          # machine with `no such module: fts5`.
          #
          # `@types/node`'s major follows this same floor, and there is now one
          # floor: `^24` everywhere, matching `engines: >=24` everywhere.
          # packages/cli was the exception at `^22` while it printed three lines
          # and published `engines: >=22`; #217 gave it commands that share code
          # with core, so it moved. That pin is this hazard pointed the other
          # way — types ahead of the runtime typecheck the tree against APIs an
          # operator on the supported floor does not have, and nothing here
          # would fail. `pnpm update` offers the newest major; take it when a
          # floor moves and not before.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        # tsc --noEmit in the typecheck step misses emit-only failures; catch
        # them here rather than in the release workflow.
        #
        # There is deliberately no Typecheck step beside this one. Every package
        # builds with `tsc -p tsconfig.json` and typechecks with the same
        # invocation plus `--noEmit`, over the same project and the same files —
        # so `pnpm typecheck` is a strict subset of what this step already did,
        # and could only fail where this one had. The root script stays, because
        # skipping emit is the faster answer while you are working; it just has
        # nothing left to say once a build has passed.
        run: pnpm -r build
      - name: The CLI publishes one file and no dependency
        # `@getlibero/cli` is the only package anyone installs from npm, and it
        # depends on `@getlibero/schema` and `@getlibero/atomic-write`, both
        # private and never published. esbuild inlines them into dist/index.js,
        # so the published manifest declares nothing to resolve — and
        # release-cli.yml deletes
        # devDependencies before publishing, because npm (unlike pnpm) does not
        # rewrite `workspace:*` and would ship a specifier no client can install.
        #
        # Asserted on every pull request rather than discovered at a tag, and in
        # a copy of the manifest so nothing here mutates the tree for the steps
        # that follow.
        working-directory: packages/cli
        run: |
          work=$(mktemp -d)
          cp package.json "$work/package.json.orig"
          trap 'mv "$work/package.json.orig" package.json; rm -rf "$work" ./*.tgz' EXIT
          npm pkg delete devDependencies
          npm pack --pack-destination "$work" --silent > /dev/null
          tarball=$(ls "$work"/*.tgz)
          tar -tzf "$tarball" | sort
          tar -xzOf "$tarball" package/package.json > "$work/manifest.json"
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (m.dependencies) throw new Error("published manifest declares dependencies");
            if (JSON.stringify(m).includes("workspace:")) throw new Error("published manifest carries a workspace: spec");
          ' "$work/manifest.json"
          tar -xzOf "$tarball" package/dist/index.js > "$work/bundle.js"
          head -1 "$work/bundle.js" | grep -qx '#!/usr/bin/env node'
          ! grep -q '"@getlibero/' "$work/bundle.js"
          # `libero channel add` mints certificates by running dev-certs.sh, and
          # npm's `files` cannot name a path outside the package — so build.mjs
          # copies it in. This is what keeps that copy from becoming a fork: the
          # script two other test suites exec at its repository path, and the one
          # an operator gets from npm, have to be the same file.
          tar -xzOf "$tarball" package/dist/dev-certs.sh > "$work/dev-certs.sh"
          diff -u ../../scripts/dev-certs.sh "$work/dev-certs.sh"
          # The published package declares MIT and inlines two dependencies, so
          # its own licence and theirs have to travel with it. `license-check.sh`
          # asks which licences are allowed, not whether their notices ship —
          # this is the half that was missing. The build fails on a bundled
          # dependency with no licence file, so a name absent here means one was
          # added and its terms were not.
          tar -xzOf "$tarball" package/LICENSE > "$work/LICENSE"
          diff -u ../../LICENSE "$work/LICENSE"
          tar -xzOf "$tarball" package/THIRD-PARTY-NOTICES.md > "$work/notices.md"
          for bundled in zod smol-toml; do
            grep -q "^## $bundled " "$work/notices.md" || {
              echo "::error::THIRD-PARTY-NOTICES.md does not carry $bundled"; exit 1;
            }
          done
      - name: Tests
        run: pnpm test

  lint-and-license:
    # Lint and the license gate read the source tree and node_modules, never
    # `dist` — so neither has any reason to wait behind a build, and behind one
    # is where they were. On their own runner they cost wall-clock nothing,
    # because the build job is longer than this whole job.
    #
    # The cost is a second install. It is paid in parallel and it is small: the
    # store is cached, so the install step measures about three seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The same floor as the build job, for the same FTS5 reason. Neither
          # of these steps opens a database, but a second Node version in one
          # workflow is a thing to explain rather than a thing to inherit.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes agent→proxy import ban)
        run: pnpm lint
      - name: License gate (fails on copyleft)
        run: pnpm license-check

  boundary-check:
    # Belt-and-suspenders alongside the ESLint rule: grep-level check that
    # nothing on the agent side of the boundary — packages/agent, packages/gateway,
    # or the apps/server process that composes both — references the proxy package.
    # The check itself is scripts/boundary-check.sh, which says why it is a raw
    # string match; running the script rather than a copy of the grep is what
    # keeps `pnpm boundary-check` and CI from drifting.
    #
    # No pnpm install: the script is shell over a checkout and needs no
    # dependencies, which is also why this job stays separate from build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce agent/proxy boundary
        run: sh scripts/boundary-check.sh

  images:
    # Both services ship as images, so a Dockerfile that does not build is a
    # release that does not happen. This job is the thing that fails first.
    #
    # It builds through deploy/docker-compose.yml rather than calling
    # `docker build` twice, because the compose file is what an operator runs
    # and its build contexts, dockerfile paths and image names are part of what
    # can break. No pnpm install: the builder stage does its own, from the same
    # frozen lockfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build both images
        # The values are placeholders and none of them reaches a layer — they
        # exist because compose interpolates the whole file before it builds,
        # and the two `:?` guards fail on an empty value as readily as on a
        # missing one. That is wanted at `up` time; here it just means a build
        # needs an environment to parse against. `.env.example` cannot serve:
        # it ships PROXY_VAULT_KEY empty, which is exactly what `:?` rejects.
        env:
          PROXY_VAULT_KEY: ci-placeholder-not-a-key
          AGENT_MODEL: ci-placeholder-not-a-model
          SLACK_APP_TOKEN: ci-placeholder
          SLACK_BOT_TOKEN: ci-placeholder
        run: docker compose -f deploy/docker-compose.yml build

      - name: Nothing in either image but what runs
        # The proxy holds every tool credential in the deployment, so what is in
        # its filesystem is a security property in the same way its dependency
        # list is. Asserting it here rather than trusting the Dockerfile is the
        # same move as boundary-check backing up the ESLint rule: the multi-stage
        # build and the `pnpm deploy --prod` prune are each one edit away from
        # silently shipping the workspace whole.
        #
        # Scoped to what this workspace built. Third-party packages ship their
        # own sources and declarations and are left as their publisher shipped
        # them — rewriting the inside of a dependency is not a hardening step.
        run: |
          failed=0
          for image in ghcr.io/getlibero/proxy:latest ghcr.io/getlibero/server:latest; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            if [ "$user" = "" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$image runs as '${user:-root}'. Both images must run as a non-root user."
              failed=1
            fi

            # One `docker run` per property. Three container starts rather than
            # one, because splitting a multi-line result back apart depends on
            # the shell's word-splitting and this has to be legible more than it
            # has to be quick.
            count() { docker run --rm --entrypoint sh "$image" -c "$1" | tr -d '[:space:]'; }

            src=$(count 'find /app -name "*.ts" ! -name "*.d.ts" -not -path "*/node_modules/*" | wc -l')
            [ "$src" = "0" ] || { echo "::error::$image carries $src TypeScript source file(s)."; failed=1; }

            tests=$(count 'find /app \( -path "/app/dist/*" -o -path "*/@getlibero/*" \) -name "*.test.js" | wc -l')
            [ "$tests" = "0" ] || { echo "::error::$image carries $tests compiled test file(s)."; failed=1; }

            toolchain=$(count 'ls /app/node_modules/.pnpm 2>/dev/null | grep -cE "^(typescript|vitest|eslint|vite|esbuild)@" || true')
            [ "$toolchain" = "0" ] || { echo "::error::$image carries $toolchain build-toolchain package(s) — the --prod prune did not happen."; failed=1; }
          done
          exit $failed

  workflow-guard:
    # A pull_request_target workflow runs with a write token against the base
    # repo. That is safe only while it never checks out or executes pull
    # request code. Enforce it mechanically rather than by comment, the same
    # way boundary-check backs up the ESLint rule above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No checkout in privileged workflows
        run: |
          # Match YAML keys, not any occurrence of the words: this file
          # mentions both in its own comments and error text.
          failed=0
          for f in .github/workflows/*.yml; do
            grep -qE '^[[:space:]]*pull_request_target:' "$f" || continue
            if grep -nE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*actions/checkout' "$f"; then
              echo "::error file=$f::$f is a pull_request_target workflow and checks out code. It runs with a write token against the base repo, so checking out the pull request head would let a fork execute arbitrary code with that token. Remove the checkout step."
              failed=1
            fi
          done
          exit $failed

# The CLA lives in its own workflow (cla.yml): it needs issue_comment and
# pull_request_target triggers, which would otherwise fire every job here on
# every PR comment.
