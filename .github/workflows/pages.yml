name: Site

on:
  # Filtered on push so an unrelated commit does not redeploy the site, but
  # deliberately unfiltered on pull_request: site-build is a required status
  # check, and a required check that does not report on some pull requests
  # blocks them forever. It has to run everywhere to be able to gate anywhere.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'design/**'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

# site/ is outside the root pnpm workspace, so the CI job in ci.yml does not
# see it. This workflow is its build, and on main its deployment.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Named site-build, not build: ci.yml already has a job called build, and a
  # required status check matches on the job name alone. Two check runs sharing
  # a name means the branch ruleset cannot tell which one it is gating on.
  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. Two build steps read per-file commit dates — the
          # sitemap's lastmod (src/lib/last-modified.mjs) and Starlight's
          # `lastUpdated` — and the default shallow clone collapses all of them
          # onto the checkout commit, so every page claims it changed on the
          # last CI run. Wrong quietly, which is the bad kind.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Astro 7 requires >=22.12; the core packages share the Node 22
          # floor in ci.yml. Build-time toolchain only; nothing shipped
          # runs on it.
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Build
        # `prebuild` regenerates the favicon and social card from design/,
        # which is why a change under design/ triggers this workflow.
        run: pnpm build
      - name: Check rendered HTML
        # Catches word boundaries swallowed across an inline tag. It has to run
        # against the built output: the defect does not exist in dev.
        run: pnpm check:html
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist

  site-deploy:
    needs: site-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
