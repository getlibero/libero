name: Release @getlibero/cli

# The CLI is the only npm-published package. Published with provenance
# attestations, cryptographically linking each release to the commit
# that built it. Everything else ships as Docker images.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # A tag alone does not release: this environment requires a reviewer's
    # approval in the Actions UI, and only cli-v* tag refs may use it. The
    # npm trusted publisher pins the same environment name, so the OIDC
    # claim makes skipping the gate a registry-side rejection, not just a
    # repo-settings one.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node 22.14+ (and npm 11.5.1+, below); the
          # workspace's own floor is Node 24, which clears it.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @getlibero/cli build
      - run: pnpm --filter @getlibero/cli test
      # Trusted publishing (OIDC): no token. npm authenticates via the runner's
      # id-token and generates the provenance attestation itself. pnpm 9's
      # publish silently ignores --provenance (0.0.1 shipped unattested), and
      # the runner's bundled npm predates trusted publishing, hence npm@latest
      # and a direct npm publish.
      - run: npm install -g npm@latest
      - name: Drop the build-only dependencies from what is published
        # The package has one workspace dependency, `@getlibero/schema`, and it
        # is a dependency of the *build*: packages/cli/build.mjs inlines the
        # schema into dist/index.js with esbuild, so an installer needs it for
        # nothing. It has to leave the manifest, because npm — unlike pnpm —
        # does not rewrite `workspace:*`, and publishing that literal specifier
        # would put a version no registry client can resolve into the one
        # package people install. That is what makes publishing from this
        # directory safe; without this step it stopped being true.
        #
        # The whole field, rather than the one entry: every dependency here is
        # build-only by construction, and an installer reads none of them. CI
        # asserts the packed result on every pull request.
        run: npm pkg delete devDependencies
        working-directory: packages/cli
      - name: Publish with provenance
        run: npm publish --access public
        working-directory: packages/cli
