name: Release @getlibero/cli

# The CLI is the only npm-published package. Published with provenance
# attestations, cryptographically linking each release to the commit
# that built it. Everything else ships as Docker images.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @getlibero/cli build
      - run: pnpm --filter @getlibero/cli test
      - name: Publish with provenance
        run: pnpm --filter @getlibero/cli publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
