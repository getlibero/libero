# Dependency updates. The site has its own workspace and lockfile, so it is a
# separate npm entry. cla.yml already allowlists dependabot[bot].
#
# Minor and patch bumps arrive grouped — one PR per ecosystem per month.
# Majors arrive as individual PRs, because they need individual decisions.
# Security advisories are not governed by this file; those PRs open regardless
# of schedule, which is the point of keeping dependabot on at all.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      core-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the engines floor, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
