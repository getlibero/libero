# Dependency updates. The site has its own workspace and lockfile, so it is a
# separate npm entry. cla.yml already allowlists dependabot[bot].
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
