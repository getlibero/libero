# Dependency updates. The site has its own workspace and lockfile, so it is a
# separate npm entry. cla.yml already allowlists dependabot[bot].
#
# Minor and patch bumps arrive grouped — one PR per ecosystem per month.
# Majors arrive as individual PRs, because they need individual decisions.
# Security advisories are not governed by this file; those PRs open regardless
# of schedule, which is the point of keeping dependabot on at all.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      core-minor-and-patch:
        update-types: ["minor", "patch"]
        # The MCP SDK never joins the monthly bundle, and that is the whole
        # trigger for a review obligation that would otherwise be prose. It runs
        # inside the process holding every tool credential, so a bump is a
        # security review: read the changelog, and answer the two questions a
        # version diff does not — whether anything new lets an upstream ask the
        # client to act on a channel's behalf (the `input_required` shape, which
        # is a refusal decision before it is an implementation one), and whether
        # the servers this deployment talks to speak the revision yet.
        # packages/proxy/README.md carries that in full. Grouped with twenty
        # other packages it would be a line in a diff nobody reads; on its own it
        # is a PR with a name that says what it is.
        exclude-patterns: ["@modelcontextprotocol/*"]
    ignore:
      # @types/node tracks the engines floor, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vite 8 is the Rolldown release, and it moved lightningcss from an
      # optional peerDependency — never installed, which is why 7 passes — to a
      # hard dependency. lightningcss is MPL-2.0, which is not in the license
      # gate's allowlist, so every vite 8 PR fails `build` on a policy question
      # rather than on anything a rebase fixes. Reopening it monthly is noise
      # against a decision that is deliberately deferred (#202).
      #
      # Pinning is cheap right now: vite is a root devDependency that exists
      # only because vitest uses its transform pipeline — there is no vite
      # config in this repository and no dev server is ever started — and
      # vite@7.3 sits in the same support tier as vite@8.1, "important fixes and
      # security patches", rather than in the security-only tier below it.
      #
      # Remove this when #202 is decided, or sooner if vitest requires vite 8:
      # that is the forcing function, and it makes the decision anyway.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
