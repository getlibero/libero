name: Bug report
description: Something in the repository does not behave as documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        The implementation trails the specification on purpose. Check the
        [roadmap](https://getlibero.com/docs/roadmap) before filing "X does not
        exist" — if it belongs to a later phase it will be labeled `parked`,
        not treated as a bug.

        Security reports do not belong here. Use private vulnerability
        reporting (Security → Report a vulnerability); see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Name the command or file. Include the exact output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version.
